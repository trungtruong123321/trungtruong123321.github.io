<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ba thợ lặn áo xanh dương, đỏ và xanh lá bơi ngang và thay đổi độ sâu theo ba nhịp khác nhau.">
  <title>Thợ lặn · Hải Lưu</title>
  <link rel="stylesheet" href="css/giao-dien.css">
  <link rel="stylesheet" href="css/canh-bien.css">
  <link rel="stylesheet" href="css/chuyen-dong.css">
  <link rel="stylesheet" href="css/dieu-khien.css">
  <script src="js/dieu-khien.js" defer></script>
</head>
<body>
  <header class="dau-trang">
    <div class="boc thanh-dieu-huong">
      <a class="thuong-hieu" href="index.html" aria-label="Hải Lưu – Trang chủ">
        <span class="dau-song" aria-hidden="true"><i></i></span>Hải Lưu
      </a>
      <nav aria-label="Điều hướng chính">
        <a href="index.html">Trang chủ</a>
        <a href="toan-canh.html">Toàn cảnh</a>
        <a href="tho-lan.html" aria-current="page">Thợ lặn</a>
        <a href="sinh-vat.html">Sinh vật biển</a>
      </nav>
      <div class="dieu-khien" role="group" aria-label="Điều khiển thủy cung">
        <button type="button" id="doi-canh" aria-controls="dai-duong" title="Cảnh hiện tại: Rạn san hô">Đổi cảnh</button>
        <button type="button" id="nut-nhac" aria-controls="nhac-bien">Phát nhạc</button>
        <span id="bao-dieu-khien" class="an-thi-giac" role="status"></span>
      </div>
      <audio id="nhac-bien" src="audio/nhac-bien.mp3" preload="none" loop></audio>
    </div>
  </header>
  <main class="boc">
    <header class="mo-canh">
      <h1>Theo chân <em>thợ lặn.</em></h1>
      <p>Nhìn theo màu áo để thấy mỗi thợ lặn mất bao lâu từ điểm nông nhất đến điểm sâu nhất.</p>
    </header>
    <figure class="be">
      <input class="nut-dung an-thi-giac" type="checkbox" id="dung-hinh" aria-controls="dai-duong">
      <div class="khung-bien" id="dai-duong" role="img" aria-label="Ba thợ lặn áo xanh dương, đỏ và xanh lá bơi ngang và thay đổi độ sâu theo ba nhịp khác nhau.">
        <div class="tia-nang" aria-hidden="true"></div>
        <div class="van-nuoc" aria-hidden="true"></div>
        <div class="hat-sang" aria-hidden="true"></div>
        <div class="ran-xa" aria-hidden="true"></div>
        <div class="ran-gan" aria-hidden="true"></div>
        <div class="day-bien" aria-hidden="true">
          <div class="cat"></div>
          <div class="rong"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="rong phai"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="san-ho"><i></i><i></i><i></i><i></i></div>
          <div class="san-ho phai"><i></i><i></i><i></i><i></i></div>
          <div class="da"></div><div class="da phai"></div><div class="sao-bien"></div>
        </div>
        <div class="bot" aria-hidden="true">
          <i style="--x: 8%; --co: 5px; --nhip: 8s; --tre: -3s"></i>
          <i style="--x: 12%; --co: 8px; --nhip: 11s; --tre: -8s"></i>
          <i style="--x: 23%; --co: 4px; --nhip: 10s; --tre: -2s"></i>
          <i style="--x: 39%; --co: 6px; --nhip: 9s; --tre: -5s"></i>
          <i style="--x: 48%; --co: 4px; --nhip: 12s; --tre: -7s"></i>
          <i style="--x: 60%; --co: 7px; --nhip: 9s; --tre: -1s"></i>
          <i style="--x: 74%; --co: 5px; --nhip: 12s; --tre: -9s"></i>
          <i style="--x: 83%; --co: 4px; --nhip: 10s; --tre: -4s"></i>
          <i style="--x: 91%; --co: 8px; --nhip: 9s; --tre: -7s"></i>
        </div>
        <div class="nhan-vat tho-luc">
          <img src="images/diver3.webp" alt="Thợ lặn áo xanh lá">
        </div>
        <div class="nhan-vat tho-xanh">
          <img src="images/diver1.webp" alt="Thợ lặn áo xanh dương">
        </div>
        <div class="nhan-vat tho-do">
          <img src="images/diver2.webp" alt="Thợ lặn áo đỏ">
        </div>
      </div>
      <figcaption>
        <span class="ten-khung">Nhóm thợ lặn</span>
        <label for="dung-hinh">
          <span class="dang-chay">Tạm dừng</span><span class="dang-dung">Phát tiếp</span>
        </label>
      </figcaption>
    </figure>
    <section class="ghi-chu" aria-labelledby="ghi-chu">
      <h2 id="ghi-chu">Một lượt lặn xuống</h2>
      <ul>
        <li style="--cham: #304d7b">Áo xanh dương · 5 giây</li>
        <li style="--cham: #c64a57">Áo đỏ · 7 giây</li>
        <li style="--cham: #478e48">Áo xanh lá · 9 giây</li>
      </ul>
    </section>
  </main>
</body>
</html>
